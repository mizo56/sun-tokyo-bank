<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>『𝑺.𝑼.𝑵⊰🧧⊱𝑻𝑶𝑲𝒀𝑶』</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#05060c;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center
}

body:before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(135deg,rgba(2,4,15,.75),rgba(55,5,30,.85)),
url("https://cdn.pixabay.com/photo/2024/05/29/17/52/anime-8790430_1280.jpg")
center/cover fixed;
z-index:-1
}

.auth{
width:100%;
padding:20px;
display:flex;
justify-content:center
}

.box{
width:min(430px,100%);
padding:30px;
border-radius:25px;
background:rgba(10,11,18,.95);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 70px rgba(0,0,0,.5)
}

.logo{
text-align:center;
font-size:23px;
font-weight:bold;
color:#f2bd4b;
margin-bottom:8px
}

.sub{
text-align:center;
color:#888;
margin-bottom:25px
}

input{
width:100%;
padding:14px;
margin:7px 0 13px;
border-radius:12px;
border:1px solid rgba(255,255,255,.12);
background:#080910;
color:white;
outline:none
}

input:focus{
border-color:#e51d48
}

button{
width:100%;
padding:13px;
border:0;
border-radius:12px;
cursor:pointer;
font-weight:bold;
color:white
}

.red{
background:linear-gradient(135deg,#e51d48,#700b23)
}

.gold{
background:linear-gradient(135deg,#b5791c,#f2bd4b);
color:#160d00
}

.gray{
background:#252733
}

.msg{
margin-top:15px;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,.05);
color:#ff607b;
text-align:center
}

.hidden{
display:none
}
</style>
</head>

<body>

<div class="auth">

<div class="box">

<div class="logo">
『𝑺.𝑼.𝑵⊰🧧⊱𝑻𝑶𝑲𝒀𝑶』
</div>

<div class="sub">
Ultimate Anime Community
</div>


<!-- تسجيل الدخول -->

<div id="loginBox">

<input
id="loginUsername"
type="text"
autocomplete="username"
placeholder="👤 اسم المستخدم">

<input
id="loginPassword"
type="password"
autocomplete="current-password"
placeholder="🔐 كلمة المرور">

<button
class="red"
onclick="login()">
🚀 تسجيل الدخول
</button>

<br><br>

<button
class="gray"
onclick="showRegister()">
✨ إنشاء حساب جديد
</button>

</div>


<!-- إنشاء الحساب -->

<div id="registerBox" class="hidden">

<input
id="registerUsername"
type="text"
autocomplete="username"
placeholder="👤 اسم المستخدم">

<input
id="registerPassword"
type="password"
autocomplete="new-password"
placeholder="🔐 كلمة المرور">

<input
id="registerPassword2"
type="password"
autocomplete="new-password"
placeholder="🔐 تأكيد كلمة المرور">

<button
class="gold"
onclick="register()">
✨ إنشاء الحساب
</button>

<br><br>

<button
class="gray"
onclick="showLogin()">
↩️ رجوع
</button>

</div>

<div id="message"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://xmavwrtlwfkvqkpfiirr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_eH4yTOKoHrhBqsZ3cj8s9g_TJSnJNC2";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
عرض الرسائل
========================= */

function message(text){

const box =
document.getElementById("message");

box.innerHTML =
`<div class="msg">${text}</div>`;

}


/* =========================
الانتقال للتسجيل
========================= */

function showRegister(){

document
.getElementById("loginBox")
.classList
.add("hidden");

document
.getElementById("registerBox")
.classList
.remove("hidden");

document
.getElementById("message")
.innerHTML="";

}


/* =========================
العودة للدخول
========================= */

function showLogin(){

document
.getElementById("registerBox")
.classList
.add("hidden");

document
.getElementById("loginBox")
.classList
.remove("hidden");

document
.getElementById("message")
.innerHTML="";

}


/* =========================
تحويل اسم المستخدم
إلى بريد داخلي مخفي
========================= */

function makeInternalEmail(username){

const clean =
username
.trim()
.toLowerCase();

let encoded =
encodeURIComponent(clean);

return (
"sun_" +
encoded
.replace(/[^a-zA-Z0-9]/g,"") +
"@sun-tokyo.local"
);

}


/* =========================
إنشاء الحساب
========================= */

async function register(){

const username =
document
.getElementById("registerUsername")
.value
.trim();

const password =
document
.getElementById("registerPassword")
.value;

const password2 =
document
.getElementById("registerPassword2")
.value;


if(username.length < 3){

return message(
"❌ اسم المستخدم يجب أن يكون 3 أحرف على الأقل"
);

}


if(username.length > 30){

return message(
"❌ اسم المستخدم طويل جدًا"
);

}


if(password.length < 6){

return message(
"❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل"
);

}


if(password !== password2){

return message(
"❌ كلمتا المرور غير متطابقتين"
);

}


/* فحص الاسم */

const {data:existing,error:checkError} =
await supabaseClient
.from("profiles")
.select("id")
.ilike("username",username)
.maybeSingle();


if(checkError){

console.error(checkError);

return message(
"❌ خطأ في الاتصال بقاعدة البيانات"
);

}


if(existing){

return message(
"❌ اسم المستخدم مستخدم بالفعل"
);

}


/* البريد الداخلي المخفي */

const email =
makeInternalEmail(username);


/* إنشاء حساب Auth */

const {data,error} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
data:{
username:username
}
}

});


if(error){

console.error(error);

return message(
"❌ تعذر إنشاء الحساب: "+
error.message
);

}


if(!data.user){

return message(
"❌ لم يتم إنشاء الحساب"
);

}


/*
لا ننشئ profiles هنا.
الـ trigger في SQL يقوم بذلك تلقائيًا.
*/


message(
"🎉 تم إنشاء الحساب بنجاح! الرصيد الابتدائي 9999 🧧"
);


/* تنظيف */

document
.getElementById("registerUsername")
.value="";

document
.getElementById("registerPassword")
.value="";

document
.getElementById("registerPassword2")
.value="";


}


/* =========================
تسجيل الدخول
========================= */

async function login(){

const username =
document
.getElementById("loginUsername")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


if(!username || !password){

return message(
"❌ أدخل اسم المستخدم وكلمة المرور"
);

}


const email =
makeInternalEmail(username);


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

return message(
"❌ اسم المستخدم أو كلمة المرور غير صحيحة"
);

}


if(!data.session){

return message(
"❌ تعذر إنشاء جلسة الدخول"
);

}


/*
هنا يمكنك فتح الصفحة الرئيسية
*/


window.location.href =
"index.html";

}


/* =========================
جلسة موجودة
========================= */

async function checkSession(){

const {data} =
await supabaseClient
.auth
.getSession();

if(data.session){

window.location.href =
"index.html";

}

}

checkSession();

</script>

</body>
</html>
