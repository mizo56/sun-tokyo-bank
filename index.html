<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>『S.U.N TOKYO』 Ultimate World</title>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0
}

:root{
 --red:#d7193f;
 --red2:#ff3159;
 --gold:#e4b04a;
 --green:#22c77a;
 --blue:#4b9cff;
 --purple:#9b6cff;
 --orange:#ff8c32;
 --pink:#ff6fa8;

 --bg:#050507;
 --panel:rgba(18,18,25,.78);
 --panel2:rgba(255,255,255,.045);
 --border:rgba(255,255,255,.10);

 --text:#fff;
 --muted:#888;
}

html{
 scroll-behavior:smooth
}

body{
 font-family:
 Tahoma,
 Arial,
 sans-serif;

 background:
 radial-gradient(
  circle at 15% 20%,
  rgba(120,0,30,.35),
  transparent 30%
 ),
 radial-gradient(
  circle at 85% 80%,
  rgba(70,30,0,.22),
  transparent 30%
 ),
 #050507;

 color:var(--text);
 min-height:100vh;
 overflow-x:hidden
}

button,
input,
select,
textarea{
 font:inherit
}

button{
 cursor:pointer;
 border:0
}

.hidden{
 display:none!important
}


/* =====================================================
   ANIMATED JAPANESE BACKGROUND
===================================================== */

#japanBackground{
 position:fixed;
 inset:0;
 z-index:-10;
 overflow:hidden;
 pointer-events:none;

 background:
 radial-gradient(
  circle at 50% 0%,
  rgba(110,0,30,.22),
  transparent 40%
 ),
 #050507
}

.moon{
 position:absolute;
 width:220px;
 height:220px;
 border-radius:50%;

 background:
 radial-gradient(
  circle at 35% 35%,
  #fff8dc,
  #e8c878 45%,
  rgba(228,176,74,.15) 70%,
  transparent 72%
 );

 right:12%;
 top:10%;
 opacity:.12;
 filter:blur(1px);

 animation:moonFloat 10s ease-in-out infinite
}

@keyframes moonFloat{

 0%,100%{
  transform:translateY(0)
 }

 50%{
  transform:translateY(15px)
 }

}

.star{
 position:absolute;
 width:3px;
 height:3px;
 background:#e4b04a;
 border-radius:50%;
 opacity:.5;

 animation:starMove linear infinite
}

@keyframes starMove{

 from{
  transform:translateY(-50px);
  opacity:0
 }

 20%{
  opacity:.7
 }

 80%{
  opacity:.4
 }

 to{
  transform:translateY(110vh);
  opacity:0
 }

}

.sakura{
 position:absolute;
 color:#ff83ae;
 opacity:.55;
 font-size:20px;

 animation:sakuraFall linear infinite;

 filter:drop-shadow(
  0 0 5px
  rgba(255,100,160,.4)
 )
}

@keyframes sakuraFall{

 0%{
  transform:
   translate3d(0,-10vh,0)
   rotate(0deg)
 }

 50%{
  transform:
   translate3d(80px,50vh,0)
   rotate(180deg)
 }

 100%{
  transform:
   translate3d(-50px,110vh,0)
   rotate(360deg)
 }

}

.wave{
 position:absolute;
 left:-10%;
 width:120%;
 height:200px;
 bottom:-80px;

 border-radius:50%;
 border-top:1px solid
 rgba(100,150,255,.10);

 transform:rotate(-3deg);

 box-shadow:
 0 -20px 40px
 rgba(30,80,160,.08);

 animation:waveMove 12s ease-in-out infinite
}

@keyframes waveMove{

 0%,100%{
  transform:translateX(0) rotate(-3deg)
 }

 50%{
  transform:translateX(-30px) rotate(-1deg)
 }

}


/* =====================================================
   HEADER
===================================================== */

header{
 position:sticky;
 top:0;
 z-index:100;

 height:70px;

 display:flex;
 align-items:center;
 justify-content:space-between;

 padding:0 24px;

 background:rgba(5,5,8,.82);
 backdrop-filter:blur(20px);

 border-bottom:1px solid var(--border)
}

.logo{
 font-size:21px;
 font-weight:900;
 color:var(--gold);
 letter-spacing:1px
}

.logo span{
 color:white
}

.header-left{
 display:flex;
 align-items:center;
 gap:10px
}

.header-user{
 display:flex;
 align-items:center;
 gap:10px
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;

 display:grid;
 place-items:center;

 background:
 linear-gradient(
  135deg,
  var(--red),
  #65091d
 );

 font-weight:bold;

 border:2px solid
 rgba(255,255,255,.12)
}

.music-btn{
 width:42px;
 height:42px;
 border-radius:50%;

 background:#181820;
 color:white;

 border:1px solid var(--border)
}

.music-btn.active{
 background:
 linear-gradient(
  135deg,
  var(--purple),
  #42237b
 );

 box-shadow:
 0 0 20px
 rgba(155,108,255,.3)
}


/* =====================================================
   LAYOUT
===================================================== */

.layout{
 display:flex;
 min-height:calc(100vh - 70px)
}

.sidebar{
 width:255px;
 flex-shrink:0;

 padding:15px;

 border-left:1px solid var(--border);

 background:rgba(7,7,10,.72);
 backdrop-filter:blur(16px);

 position:sticky;
 top:70px;

 height:calc(100vh - 70px);

 overflow-y:auto
}

.nav-title{
 font-size:10px;
 color:#666;
 margin:18px 8px 7px
}

.nav button{
 width:100%;

 padding:12px 14px;
 margin:3px 0;

 background:transparent;
 color:#aaa;

 border-radius:12px;

 text-align:right;

 transition:.2s
}

.nav button:hover{
 background:rgba(215,25,63,.12);
 color:white
}

.nav button.active{
 background:
 linear-gradient(
  90deg,
  rgba(215,25,63,.35),
  rgba(215,25,63,.04)
 );

 color:white;

 border-right:3px solid var(--red)
}

.main{
 flex:1;
 width:100%;
 max-width:1600px;

 margin:auto;

 padding:25px
}


/* =====================================================
   COMMON
===================================================== */

.page{
 animation:pageIn .3s ease
}

@keyframes pageIn{

 from{
  opacity:0;
  transform:translateY(8px)
 }

 to{
  opacity:1;
  transform:none
 }

}

.hero{
 position:relative;
 overflow:hidden;

 padding:30px;

 border-radius:25px;

 background:
 linear-gradient(
  135deg,
  rgba(215,25,63,.25),
  rgba(228,176,74,.06)
 ),
 var(--panel);

 border:1px solid var(--border);

 margin-bottom:20px
}

.hero:after{
 content:"🌸";

 position:absolute;
 left:30px;
 bottom:-40px;

 font-size:160px;
 opacity:.05
}

.hero h1{
 font-size:29px;
 margin-bottom:8px
}

.hero p{
 color:#aaa;
 line-height:1.8
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;

 margin-bottom:20px
}

.card{
 background:var(--panel);

 border:1px solid var(--border);
 border-radius:19px;

 padding:20px;

 backdrop-filter:blur(14px);

 box-shadow:
 0 10px 40px
 rgba(0,0,0,.08)
}

.card:hover{
 border-color:
 rgba(255,255,255,.15)
}

.stat-icon{
 font-size:27px
}

.stat-title{
 color:#888;
 font-size:12px;
 margin-top:8px
}

.stat-value{
 font-size:25px;
 font-weight:900;
 margin-top:5px
}

.gold{
 color:var(--gold)
}

.red{
 color:#ff4c6d
}

.green{
 color:var(--green)
}

.blue{
 color:var(--blue)
}

.purple{
 color:var(--purple)
}

.orange{
 color:var(--orange)
}

.section{
 margin-top:25px
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:12px
}

.section-head h2{
 font-size:19px
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
 padding:11px 17px;
 border-radius:12px;

 background:
 linear-gradient(
  135deg,
  var(--red),
  #8d0925
 );

 color:white;
 font-weight:bold;

 transition:.2s
}

.btn:hover{
 transform:translateY(-2px);
 filter:brightness(1.1)
}

.btn.goldbtn{
 background:
 linear-gradient(
  135deg,
  #b77d20,
  var(--gold)
 );

 color:#130d02
}

.btn.greenbtn{
 background:
 linear-gradient(
  135deg,
  #159c5d,
  var(--green)
 )
}

.btn.bluebtn{
 background:
 linear-gradient(
  135deg,
  #286dcc,
  var(--blue)
 )
}

.btn.purplebtn{
 background:
 linear-gradient(
  135deg,
  #6337c7,
  var(--purple)
 )
}

.btn.secondary{
 background:#22232b;
 color:#ddd
}

.btn.danger{
 background:#7c1127
}

.btn.full{
 width:100%
}

.btn.small{
 padding:7px 10px;
 font-size:12px
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px
}

.action{
 padding:19px;

 border-radius:16px;

 background:rgba(255,255,255,.045);
 border:1px solid var(--border);

 color:white;

 text-align:center;

 transition:.2s
}

.action:hover{
 border-color:var(--red);
 transform:translateY(-3px);

 background:
 rgba(215,25,63,.08)
}

.action b{
 display:block;
 margin-top:8px
}

.action small{
 color:#777
}


/* =====================================================
   TABLE
===================================================== */

.table{
 width:100%;
 border-collapse:collapse
}

.table th,
.table td{
 padding:13px;

 border-bottom:1px solid var(--border);

 text-align:right
}

.table th{
 color:#777;
 font-size:11px
}

.table tr:hover td{
 background:rgba(255,255,255,.02)
}

.badge{
 display:inline-block;

 padding:5px 10px;

 border-radius:20px;

 background:
 rgba(228,176,74,.12);

 color:var(--gold);

 font-size:11px
}


/* =====================================================
   PROGRESS
===================================================== */

.progress{
 height:9px;

 background:#222;

 border-radius:30px;

 overflow:hidden;

 margin-top:10px
}

.progress i{
 display:block;

 height:100%;
 width:0;

 background:
 linear-gradient(
  90deg,
  var(--red),
  var(--gold)
 );

 transition:width .5s
}


/* =====================================================
   INPUT
===================================================== */

input,
select,
textarea{
 width:100%;

 padding:12px;

 margin:7px 0 12px;

 border:1px solid var(--border);

 border-radius:12px;

 background:#08080c;
 color:white;

 outline:none
}

textarea{
 min-height:90px;
 resize:vertical
}

input:focus,
select:focus,
textarea:focus{
 border-color:var(--red)
}


/* =====================================================
   MODAL
===================================================== */

.modal{
 position:fixed;
 inset:0;

 z-index:500;

 background:rgba(0,0,0,.78);
 backdrop-filter:blur(8px);

 display:none;

 align-items:center;
 justify-content:center;

 padding:20px
}

.modal.show{
 display:flex
}

.modal-box{
 width:min(520px,100%);

 background:#111116;

 border:1px solid var(--border);

 border-radius:23px;

 padding:25px;

 box-shadow:
 0 25px 100px #000;

 max-height:90vh;

 overflow:auto
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;

 margin-bottom:20px
}

.close{
 background:none;
 color:#aaa;
 font-size:27px
}


/* =====================================================
   AUTH
===================================================== */

.auth{
 position:fixed;
 inset:0;

 z-index:1000;

 background:
 radial-gradient(
  circle at 50% 15%,
  #500919,
  transparent 35%
 ),
 #060609;

 display:flex;

 align-items:center;
 justify-content:center;

 padding:20px
}

.auth-box{
 width:min(450px,100%);

 background:
 rgba(17,17,22,.94);

 border:1px solid var(--border);

 border-radius:27px;

 padding:30px;

 box-shadow:
 0 25px 100px #000
}

.auth-logo{
 text-align:center;

 font-size:27px;

 font-weight:900;

 color:var(--gold)
}

.auth-sub{
 text-align:center;

 color:#777;

 margin:8px 0 25px
}


/* =====================================================
   SHOP
===================================================== */

.shop-filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;

 margin-bottom:15px
}

.filter{
 padding:9px 13px;

 border-radius:20px;

 background:#191920;
 color:#aaa;

 border:1px solid var(--border)
}

.filter.active{
 color:white;

 background:
 rgba(215,25,63,.25);

 border-color:var(--red)
}

.products{
 display:grid;

 grid-template-columns:
 repeat(5,1fr);

 gap:13px
}

.product{
 position:relative;

 background:
 rgba(255,255,255,.045);

 border:1px solid var(--border);

 border-radius:17px;

 padding:15px;

 transition:.2s
}

.product:hover{
 transform:translateY(-4px);

 border-color:
 rgba(228,176,74,.5)
}

.product-icon{
 font-size:38px;
 margin-bottom:8px
}

.product-name{
 font-weight:bold;
 margin-bottom:5px
}

.product-desc{
 color:#777;
 font-size:11px;

 min-height:30px;

 margin-bottom:10px
}

.product-price{
 color:var(--gold);

 font-weight:bold;

 margin-bottom:10px
}

.product-category{
 position:absolute;

 top:10px;
 left:10px;

 font-size:9px;

 color:#888
}


/* =====================================================
   INVENTORY
===================================================== */

.inventory-grid{
 display:grid;

 grid-template-columns:
 repeat(6,1fr);

 gap:12px
}

.inventory-item{
 padding:16px;

 background:
 rgba(255,255,255,.045);

 border:1px solid var(--border);

 border-radius:16px;

 text-align:center
}

.inventory-item .icon{
 font-size:35px
}

.inventory-count{
 color:var(--gold);

 font-weight:bold;

 margin-top:7px
}


/* =====================================================
   FARM
===================================================== */

.farm-grid{
 display:grid;

 grid-template-columns:
 repeat(4,1fr);

 gap:14px
}

.farm-plot{
 min-height:170px;

 padding:18px;

 border-radius:20px;

 background:
 linear-gradient(
  180deg,
  rgba(30,100,60,.15),
  rgba(20,50,30,.3)
 );

 border:1px solid
 rgba(34,199,122,.2);

 text-align:center
}

.farm-plot.empty{
 border-style:dashed
}

.crop-icon{
 font-size:48px;
 margin:15px
}


/* =====================================================
   CITY
===================================================== */

.city-grid{
 display:grid;

 grid-template-columns:
 repeat(3,1fr);

 gap:15px
}

.building{
 position:relative;

 padding:22px;

 min-height:190px;

 border-radius:20px;

 background:
 linear-gradient(
  135deg,
  rgba(75,156,255,.10),
  rgba(155,108,255,.05)
 );

 border:1px solid
 rgba(75,156,255,.15)
}

.building-icon{
 font-size:50px
}

.level-pill{
 position:absolute;

 top:15px;
 left:15px;

 background:
 rgba(75,156,255,.15);

 color:var(--blue);

 padding:5px 9px;

 border-radius:20px;

 font-size:10px
}


/* =====================================================
   CHAT
===================================================== */

.chat-layout{
 display:grid;
 grid-template-columns:280px 1fr;

 gap:15px
}

.chat-users{
 background:var(--panel);

 border:1px solid var(--border);

 border-radius:20px;

 padding:15px;

 max-height:600px;

 overflow:auto
}

.chat-user{
 padding:12px;

 border-radius:12px;

 cursor:pointer;

 margin-bottom:5px
}

.chat-user:hover{
 background:rgba(255,255,255,.05)
}

.chat-user.active{
 background:
 rgba(215,25,63,.15);

 border-right:
 3px solid var(--red)
}

.chat-box{
 background:var(--panel);

 border:1px solid var(--border);

 border-radius:20px;

 min-height:600px;

 display:flex;

 flex-direction:column
}

.chat-messages{
 flex:1;

 padding:20px;

 overflow:auto
}

.message{
 max-width:75%;

 padding:11px 14px;

 border-radius:15px;

 margin-bottom:10px;

 background:
 rgba(255,255,255,.06)
}

.message.me{
 margin-right:auto;

 background:
 rgba(215,25,63,.18)
}

.chat-input{
 padding:12px;

 border-top:
 1px solid var(--border);

 display:flex;

 gap:8px
}

.chat-input input{
 margin:0
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1200px){

 .grid{
  grid-template-columns:
  repeat(2,1fr)
 }

 .products{
  grid-template-columns:
  repeat(3,1fr)
 }

 .inventory-grid{
  grid-template-columns:
  repeat(4,1fr)
 }

}

@media(max-width:900px){

 .sidebar{
  width:210px
 }

 .actions{
  grid-template-columns:
  repeat(2,1fr)
 }

 .city-grid{
  grid-template-columns:
  repeat(2,1fr)
 }

 .farm-grid{
  grid-template-columns:
  repeat(2,1fr)
 }

}

@media(max-width:700px){

 header{
  padding:0 12px
 }

 .sidebar{
  display:none
 }

 .main{
  padding:14px
 }

 .grid{
  grid-template-columns:1fr
 }

 .products{
  grid-template-columns:
  repeat(2,1fr)
 }

 .inventory-grid{
  grid-template-columns:
  repeat(2,1fr)
 }

 .city-grid,
 .farm-grid{
  grid-template-columns:1fr
 }

 .chat-layout{
  grid-template-columns:1fr
 }

 .hero h1{
  font-size:22px
 }

}

</style>
</head>

<!-- =====================================================
     MODAL
===================================================== -->

<div
 class="modal"
 id="modal"
 onclick="if(event.target===this)closeModal()"
>

function register(){

 const username=
  document
   .getElementById('regName')
   .value
   .trim();

 const pass=
  document
   .getElementById('regPass')
   .value;

 const pass2=
  document
   .getElementById('regPass2')
   .value;

  alert('اكتب اسم المستخدم وكلمة المرور');

  return;

 }

  alert('كلمتا المرور غير متطابقتين');

  db.users.some(
   u=>
    u.username.toLowerCase()===
    username.toLowerCase()
  )
 ){

  return;

  createDefaultUser(
   username,
   pass
  );

 alert(
  'تم إنشاء الحساب بنجاح 🎉'
 );

 showLogin();

}

/* =====================================================
   HELPERS
===================================================== */

function money(n){

 return Number(n||0)
  .toLocaleString('en-US');

}

function esc(str){

 return String(str??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");

}

function notify(
 text,
 type='system'
){

 if(!currentUser)return;

 currentUser.notifications.unshift({

  id:Date.now()+Math.random(),

  text,

  type,

  read:false,

  time:
   new Date().toLocaleString()

 });

 db.notifications.unshift({

  userId:currentUser.id,

  text,

  type,

  time:
   new Date().toLocaleString()

 });

 save();

}

function addTransaction(
 type,
 amount,
 note
){

 if(!currentUser)return;

 currentUser.stats.trades++;

 db.transactions.unshift({

  id:Date.now()+Math.random(),

  userId:currentUser.id,

  username:currentUser.username,

  type,

  amount,

  note,

  time:
   new Date().toLocaleString()

 });

 save();

}

function addXP(amount){

 currentUser.xp+=amount;

 const need=
  currentUser.level*100;

 if(currentUser.xp>=need){

  currentUser.xp-=need;

  currentUser.level++;

  currentUser.power+=10;

  currentUser.attack+=3;

  currentUser.defense+=3;

  currentUser.hp+=10;

  notify(
   `🎉 ارتقيت إلى المستوى ${currentUser.level}`
  );

 }

 save();

}

function changeBalance(amount){

 currentUser.balance+=amount;

 if(currentUser.balance<0){

  currentUser.balance=0;

 }

 save();

}

}

function transferMoney(){

 const username=
  document
   .getElementById('transferUser')
   .value
   .trim();

 const amount=
  Number(
   document
    .getElementById('transferAmount')
    .value
  );

 if(!username || amount<=0){

  alert('أدخل البيانات بشكل صحيح');

  return;

 }

 if(amount>currentUser.balance){

  alert('رصيدك غير كافٍ');

  return;

 }

 const receiver=
  db.users.find(
   u=>
    u.username.toLowerCase()===
    username.toLowerCase()
  );

 if(!receiver){

  alert('المستخدم غير موجود');

  return;

 }

 if(receiver.id===currentUser.id){

  alert('لا يمكنك التحويل لنفسك');

  return;

 }

 currentUser.balance-=amount;

 receiver.balance+=amount;

 receiver.notifications.unshift({

  text:
   `💰 استلمت ${money(amount)} من ${currentUser.username}`,

  type:'transfer',

  read:false,

  time:
   new Date().toLocaleString()

 });

 addTransaction(
  'تحويل',
  -amount,
  `إلى ${receiver.username}`
 );

 save();

 alert('تم التحويل بنجاح ✅');

 page('wallet');

}

 page('farm');

  SHOP_ITEMS.find(
   x=>x.id===id
  );

 if(!item)return;

 if(
  currentUser.balance<
  item.price
 ){

  alert('❌ رصيدك غير كافٍ');

  return;

 }

 currentUser.balance-=item.price;


 /* =========================
    صندوق الحظ
 ========================= */

 if(id==='box_basic'){

  openBasicBox();

  addTransaction(
   'شراء',
   -item.price,
   'صندوق الحظ'
  );

  save();

  page('shop');

  return;

 }


 /* =========================
    الصندوق الذهبي
 ========================= */

 if(id==='box_gold'){

  openGoldBox();

  addTransaction(
   'شراء',
   -item.price,
   'الصندوق الذهبي'
  );

  save();

  page('shop');

  return;

 }


 /* =========================
    الطاقة
 ========================= */

 if(id==='energy'){

  currentUser.energy=
   Math.min(
    100,
    currentUser.energy+50
   );

  notify(
   '⚡ تمت إضافة 50 طاقة'
  );

 }


 /* =========================
    جرعة الصحة
 ========================= */

 else if(id==='potion'){

  currentUser.hp+=50;

  currentUser.power+=5;

  notify(
   '❤️ استخدمت جرعة الصحة'
  );

 }


 /* =========================
    المعدات
 ========================= */

 else if(
  item.attack ||
  item.defense
 ){

  currentUser.equipment.push({

   id:item.id,

   name:item.name,

   icon:item.icon,

   attack:item.attack||0,

   defense:item.defense||0

  });

  currentUser.attack+=
   item.attack||0;

  currentUser.defense+=
   item.defense||0;

  currentUser.power+=
   (item.attack||0)+
   (item.defense||0);

  notify(
   `⚔️ حصلت على ${item.name}`
  );

 }


 /* =========================
    المنزل
 ========================= */

 else if(
  id==='sakura' ||
  id==='lantern'
 ){

  currentUser.house.furniture.push(
   item.name
  );

  notify(
   `🏠 أضفت ${item.name} إلى منزلك`
  );

 }


 /* =========================

 ========================= */

 else if(id==='card_pack'){

 }


 /* =========================

 else if(id==='lucky_ticket'){

const CARD_NAMES=[

 'ناروتو',
 'لوفي',
 'غوكو',
 'زورو',
 'ساسكي',
 'إيتاتشي',
 'تانجيرو',
 'غوجو',

 'ميكاسا',
 'كيلوا',

function generateRandomCard(){

 const name=
  CARD_NAMES[
   Math.floor(
    Math.random()*
    CARD_NAMES.length
   )
  ];

  Math.random();

 }

  rarity='ملحمية';

 }

  rarity='نادرة';

 }

 const multiplier={
  'عادية':1,
  'نادرة':2,
  'ملحمية':4,
  'أسطورية':8
 }[rarity];

 return {

  id:
   'card_'+
   Date.now()+
   Math.random(),

  name,

  rarity,

  level:1,

  attack:
   20*multiplier,

  defense:
   15*multiplier,

  hp:
   100*multiplier,

  createdAt:
   new Date().toISOString()

 };

}

function mergeCards(){

 const cards=
  currentUser.cards;

 const groups={};

 cards.forEach(
  card=>{

   const key=
    card.name+
    '_'+
    card.rarity;

   if(!groups[key]){
    groups[key]=[];
   }

   groups[key].push(card);

  }
 );

 let found=null;

 for(
  const key in groups
 ){

  if(
   groups[key].length>=2
  ){

   found=
    groups[key];

   break;

  }

 }

 if(!found){

  alert(
   '❌ تحتاج إلى بطاقتين متطابقتين من نفس الندرة.'
  );

  return;

 }

 const first=
  found[0];

 const second=
  found[1];

 const i1=
  cards.indexOf(first);

 const i2=
  cards.indexOf(second);

 cards.splice(
  Math.max(i1,i2),
  1
 );

 cards.splice(
  Math.min(i1,i2),
  1
 );

 const newCard={
  ...first,

  id:
   'card_'+
   Date.now()+
   Math.random(),

  level:
   first.level+1,

  attack:
   Math.floor(
    first.attack*1.5
   ),

  defense:
   Math.floor(
    first.defense*1.5
   ),

  hp:
   Math.floor(
    first.hp*1.5
   )

 };

 cards.push(newCard);

 addXP(50);

 notify(
  `🔥 تم دمج بطاقتين للحصول على ${newCard.name} مستوى ${newCard.level}`
 );

 save();

 page('cards');

}

function createAuction(){

 const item=
  document
   .getElementById(
    'auctionItem'
   )
   .value
   .trim();

 const price=
  Number(
   document
    .getElementById(
     'auctionPrice'
    )
    .value
  );

 if(
  !item ||
  price<=0
 ){

  alert('بيانات المزاد غير صحيحة');

  return;

 }

 db.auctions.push({

  id:
   'auction_'+
   Date.now()+
   Math.random(),

  ownerId:
   currentUser.id,

  owner:
   currentUser.username,

  item,

  startPrice:
   price,

  highestBid:
   price,

  highestBidderId:
   null,

  highestBidder:
   null,

  status:'active',

  createdAt:
   new Date().toISOString()

 });

 save();

 page('auction');

}


function bidAuction(id){

 const auction=
  db.auctions.find(
   x=>x.id===id
  );

 if(!auction){

  alert('المزاد غير موجود');

  return;

 }

 if(
  auction.ownerId===
  currentUser.id
 ){

  alert(
   'لا يمكنك المزايدة على مزادك'
  );

  return;

 }

 const minimum=
  auction.highestBid+
  Math.max(
   100,
   Math.floor(
    auction.highestBid*.1
   )
  );

 const bid=
  Number(
   prompt(
    `أقل عرض: ${minimum}`
   )
  );

 if(
  !bid ||
  bid<minimum
 ){

  alert('العرض غير صالح');

  return;

 }

 if(
  currentUser.balance<bid
 ){

  alert('رصيدك غير كافٍ');

  return;

 }

 currentUser.balance-=bid;

 if(
  auction.highestBidderId
 ){

  const oldBidder=
   db.users.find(
    u=>
     u.id===
     auction.highestBidderId
   );

  if(oldBidder){

   oldBidder.balance+=
    auction.highestBid;

  }

 }

 auction.highestBid=bid;

 auction.highestBidderId=
  currentUser.id;

 auction.highestBidder=
  currentUser.username;

 save();

 alert(
  'تم تسجيل عرضك في المزاد 🔨'
 );

 page('auction');

}

function sendFriendRequest(){

  currentUser.friends.includes(
   user.id
  )
 ){

function acceptFriend(id){

 const request=
  currentUser.friendRequests.find(
   r=>r.id===id
  );

 if(!request)return;

 const friend=
  db.users.find(
   u=>u.id===id
  );

 if(!friend)return;

 currentUser.friends.push(
  friend.id
 );

 friend.friends.push(
  currentUser.id
 );

 currentUser.friendRequests=
  currentUser.friendRequests.filter(
   r=>r.id!==id
  );

 friend.notifications.unshift({

  text:
   `👥 قبل ${currentUser.username} طلب صداقتك`,

  type:'friend',

  read:false,

  time:
   new Date().toLocaleString()

 });

 save();

 alert(
  `تمت إضافة ${friend.username} كصديق ✅`
 );

 page('friends');

}

function leaveGuild(){

 const guild=
  db.guilds.find(
   g=>
    g.name===
    currentUser.guild
  );

 if(guild){

  guild.members=
   guild.members.filter(
    id=>
     id!==currentUser.id
   );

  if(
   guild.ownerId===
   currentUser.id
  ){

   if(guild.members.length){

    guild.ownerId=
     guild.members[0];

    const newOwner=
     db.users.find(
      u=>
       u.id===
       guild.members[0]
     );

    guild.owner=
     newOwner
     ?
     newOwner.username
     :
     'عضو';

   }
   else{

    db.guilds=
     db.guilds.filter(
      g=>g.id!==guild.id
     );

   }

 }

 currentUser.guildRole=null;

 save();

 page('guilds');

}

function battle(enemyId){

 const enemy=
  db.users.find(
   u=>u.id===enemyId
  );

 if(!enemy)return;

 const costEnergy=20;

 if(
  currentUser.energy<
  costEnergy
 ){

  alert(
   'تحتاج إلى طاقة أكثر'
  );

  return;

 }

 currentUser.energy-=
  costEnergy;

 currentUser.stats.battles++;

 enemy.stats.battles++;

 const myPower=
  currentUser.power+
  Math.random()*100;

 const enemyPower=
  enemy.power+
  Math.random()*100;

 const win=
  myPower>=enemyPower;

 let reward=0;

 if(win){

  currentUser.stats.wins++;

  reward=
   500+
   enemy.level*100;

  currentUser.balance+=
   reward;

  addXP(
   50+
   enemy.level*5
  );

  notify(
   `🏆 فزت على ${enemy.username} وحصلت على ${money(reward)} 🧧`
  );

 }
 else{

  currentUser.stats.losses++;

  const loss=
   Math.min(
    300,
    currentUser.balance
   );

  currentUser.balance-=
   loss;

  enemy.balance+=loss;

  notify(
   `💀 خسرت أمام ${enemy.username}`
  );

 }

 save();

 openModal(
  '⚔️ نتيجة المعركة',
  `

    padding:25px
   ">

    <div style="font-size:80px">

      win
      ?
      '🎉 انتصار!'
      :
      '💀 هزيمة'
     }

function transferMoney(){

 const username=
  document
   .getElementById(
    'transferUser'
   )
   .value
   .trim();

 const amount=
  Number(
   document
    .getElementById(
     'transferAmount'
    )
    .value
  );

 const note=
  document
   .getElementById(
    'transferNote'
   )
   .value
   .trim();


 if(!username){

  alert(
   'اكتب اسم المستخدم'
  );

  return;

 }


 if(
  !Number.isFinite(amount) ||
  amount<=0
 ){

  alert(
   'أدخل مبلغًا صحيحًا'
  );

  return;

 }


 if(
  currentUser.balance<
  amount
 ){

  alert(
   '❌ رصيدك غير كافٍ'
  );

  return;

 }


 const receiver=
  db.users.find(
   u=>
    u.username.toLowerCase()===
    username.toLowerCase()
  );


 if(!receiver){

  alert(
   '❌ المستخدم غير موجود'
  );

  return;

 }


 if(
  receiver.id===
  currentUser.id
 ){

  alert(
   '❌ لا يمكنك التحويل لنفسك'
  );

  return;

 }


 currentUser.balance-=
  amount;

 receiver.balance+=
  amount;


 currentUser.totalSpent=
  (currentUser.totalSpent||0)+
  amount;


 receiver.totalEarned=
  (receiver.totalEarned||0)+
  amount;


 addTransaction(
  'تحويل',
  -amount,
  `إلى ${receiver.username}`
 );


 addTransactionToUser(
  receiver,
  'استلام تحويل',
  amount,
  `من ${currentUser.username}`
 );


 receiver.notifications=
  receiver.notifications||[];


 receiver.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text:
   `💸 استلمت ${money(amount)} 🧧 من ${currentUser.username}`+
   (
    note
    ?
    ` — ${note}`
    :
    ''
   ),

  type:'transfer',

  read:false,

  time:
   new Date().toLocaleString()

 });


 save();

 closeModal();

 notify(
  `✅ تم تحويل ${money(amount)} 🧧 إلى ${receiver.username}`
 );


 page('wallet');

}

function claimDaily(){

 const today=
  new Date()
   .toISOString()
   .slice(0,10);


 if(
  currentUser.dailyClaim===
  today
 ){

  alert(
   'استلمت مكافأتك اليوم'
  );

  return;

 }


 const yesterday=
  new Date(
   Date.now()-
   86400000
  )
  .toISOString()
  .slice(0,10);


 if(
  currentUser.dailyClaim===
  yesterday
 ){

  currentUser.dailyStreak=
   (
    currentUser.dailyStreak||0
   )+1;

 }
 else{

  currentUser.dailyStreak=1;

 }


 const rewards=[

  500,
  750,
  1000,
  1500,
  2000,
  3000,
  5000

 ];


 const reward=
  rewards[
   (
    currentUser.dailyStreak-1
   )%
   rewards.length
  ];


 currentUser.balance+=
  reward;


 currentUser.totalEarned=
  (currentUser.totalEarned||0)+
  reward;

/* =====================================================
   LEVEL SYSTEM
===================================================== */

function addXP(amount){

 amount=
  Number(amount)||0;


 if(amount<=0)return;


 currentUser.xp+=
  amount;


 while(
  currentUser.xp>=
  currentUser.level*100
 ){

  currentUser.xp-=
   currentUser.level*100;

  currentUser.level++;

  currentUser.power+=10;

  currentUser.hp+=20;

  currentUser.attack+=5;

  currentUser.defense+=5;


  notify(
   `🎉 وصلت إلى المستوى ${currentUser.level}!`
  );

 }


 updateRank();

 save();

}


function updateRank(){

 const level=
  currentUser.level;


 let rank='مبتدئ';


 if(level>=5){

  rank='محارب';

 }


 if(level>=10){

  rank='فارس';

 }


 if(level>=20){

  rank='ساموراي';

 }


 if(level>=30){

  rank='نينجا';

 }


 if(level>=50){

  rank='أسطورة';

 }


 if(level>=75){

  rank='ملك';

 }


 if(level>=100){

  rank='👑 إمبراطور S.U.N TOKYO';

 }


 currentUser.rank=
  rank;

}

function notify(text){

 if(
  !currentUser.notifications
 ){

  currentUser.notifications=[];

 }


 currentUser.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text,

  type:'system',

  read:false,

  time:
   new Date().toLocaleString()

 });


 currentUser.notifications=
  currentUser.notifications
   .slice(0,100);


 save();

}


/* =====================================================
   MONEY FORMAT
===================================================== */

function money(value){

 const number=
  Number(value)||0;


 return number.toLocaleString(
  'en-US',
  {
   maximumFractionDigits:0
  }
 );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

 return String(
  value??''
 )
 .replace(
  /&/g,
  '&amp;'
 )
 .replace(
  /</g,
  '&lt;'
 )
 .replace(

/* =====================================================

===================================================== */

function updateNavigation(
 current
){

 document
  .querySelectorAll(
   '[data-page]'
  )
  .forEach(
   el=>{

    if(
     el.dataset.page===
     current
    ){

     el.classList.add(
      'active'
     );

    }
    else{

     el.classList.remove(
      'active'
     );

    }

   }
  );

}


/* =====================================================

function safeParse(
 value,
 fallback
){

 try{

  return JSON.parse(
   value
  );

 }
 catch(e){

  return fallback;

 }


}

   u=>

  );


 if(index!==-1){

 try{

function upgradeCard(index){

 const card=
  (
   currentUser.cards||
   []
  )[index];


 if(!card)return;


 const cost=
  Math.max(
   100,
   (card.level||1)*250
  );


 if(
  currentUser.balance<
  cost
 ){

  alert(
   `تحتاج ${money(cost)} 🧧`
  );

  return;

 }


 currentUser.balance-=
  cost;


 currentUser.totalSpent=
  (currentUser.totalSpent||0)+
  cost;


 card.level=
  (card.level||1)+1;


 card.power=
  Math.floor(
   card.power*1.15
  );


 addTransaction(
  'تطوير',
  -cost,
  `تطوير بطاقة ${card.name}`
 );


 addXP(25);


 save();


 closeModal();


 notify(
  `🎴 تم تطوير ${card.name} إلى المستوى ${card.level}`

function sellMarketItem(){

 const name=
  document
   .getElementById(
    'sellName'
   )
   .value
   .trim();


 const price=
  Number(
   document
    .getElementById(
     'sellPrice'
    )
    .value
  );


 if(!name){

  alert(
   'اكتب اسم العنصر'
  );

  return;

 }


 if(
  !Number.isFinite(price) ||
  price<=0
 ){

  alert(
   'أدخل سعرًا صحيحًا'
  );

  return;

 }


 db.market=
  db.market||[];


 db.market.push({

  id:
   'market_'+
   Date.now()+
   Math.random(),

  name,

  price,

  seller:
   currentUser.username,

  sellerId:
   currentUser.id,

  icon:'📦',

  createdAt:
   new Date().toLocaleString()

 });


 save();

 closeModal();

 notify(
  `🏪 تم عرض ${name} للبيع`
 );

 page('market');

}


function buyMarketItem(index){

 const item=
  (
   db.market||
   []
  )[index];


 if(!item)return;


 if(
  item.sellerId===
  currentUser.id
 ){

  alert(
   '❌ لا يمكنك شراء إعلانك'
  );

  return;

 }


 if(
  currentUser.balance<
  item.price
 ){

  alert(
   '❌ رصيدك غير كافٍ'
  );

  return;

 }


 const seller=
  db.users.find(
   u=>
    u.id===
    item.sellerId
  );


 currentUser.balance-=
  item.price;


 currentUser.totalSpent=
  (currentUser.totalSpent||0)+
  item.price;


 if(seller){

  seller.balance+=
   item.price;

  seller.totalEarned=
   (seller.totalEarned||0)+
   item.price;

  addTransactionToUser(
   seller,
   'بيع',
   item.price,
   `بيع ${item.name}`
  );

 }


 if(
  !currentUser.inventory
 ){

  currentUser.inventory={};

 }


 currentUser.inventory[
  item.name
 ]=
  (
   currentUser.inventory[
    item.name
   ]||0
  )+1;


 db.market.splice(
  index,
  1
 );


 addTransaction(
  'شراء',
  -item.price,
  `شراء ${item.name}`
 );


 currentUser.stats.trades=
  (
   currentUser.stats.trades||0
  )+1;


 save();


 notify(
  `🛒 اشتريت ${item.name} بنجاح`
 );


 page('market');

}

function acceptFriend(id){

 const requestIndex=
  (
   currentUser.friendRequests||
   []
  ).findIndex(
   r=>r.id===id
  );


 if(
  requestIndex===-1
 ){

  return;

 }


 const request=
  currentUser.friendRequests[
   requestIndex
  ];


 const sender=
  db.users.find(
   u=>u.id===id
  );


 currentUser.friendRequests.splice(
  requestIndex,
  1
 );


 if(
  !currentUser.friends.includes(id)
 ){

  currentUser.friends.push(id);

 }


 if(
  sender &&
  !sender.friends.includes(
   currentUser.id
  )
 ){

  sender.friends.push(
   currentUser.id
  );

  sender.notifications=
   sender.notifications||[];

  sender.notifications.unshift({

   id:
    'notification_'+
    Date.now()+
    Math.random(),

   text:
    `👥 قبل ${currentUser.username} طلب صداقتك.`,

   type:'friend',

   read:false,

   time:
    new Date().toLocaleString()

  });

 }


 save();


 notify(
  `👥 أصبحت ${request.username} صديقًا لك`
 );


 page('friends');

}


function rejectFriend(id){

 currentUser.friendRequests=
  (
   currentUser.friendRequests||
   []
  ).filter(
   r=>r.id!==id
  );


 save();

 page('friends');

}

function createGuild(){

 const name=
  document
   .getElementById(
    'guildName'
   )
   .value
   .trim();


 if(
  name.length<3
 ){

  alert(
   'اسم النقابة قصير جدًا'
  );

  return;

 }


 if(
  currentUser.guild
 ){

  alert(
   'أنت بالفعل في نقابة'
  );

  return;

 }


 const exists=
  db.guilds.some(
   g=>
    g.name.toLowerCase()===
    name.toLowerCase()
  );


 if(exists){

  alert(
   'اسم النقابة مستخدم'
  );

  return;

 }


 const guild={

  id:
   'guild_'+
   Date.now()+
   Math.random(),

  name,

  ownerId:
   currentUser.id,

  ownerName:
   currentUser.username,

  members:[
   currentUser.id
  ],

  level:1,

  xp:0,

  createdAt:
   new Date().toLocaleString()

 };


 db.guilds.push(
  guild
 );


 currentUser.guild=
  guild.name;


 save();

 closeModal();

 notify(
  `🏯 تم إنشاء نقابة ${guild.name}`
 );

 page('guilds');

function joinGuild(index){

 const guild=
  (
   db.guilds||
   []
  )[index];


 if(!guild)return;


 if(
  currentUser.guild
 ){

  alert(
   'غادرت نقابتك الحالية أولًا'
  );

  return;

 }


 guild.members=
  guild.members||[];


 if(
  !guild.members.includes(
   currentUser.id
  )
 ){

  guild.members.push(
   currentUser.id
  );

 }


 currentUser.guild=
  guild.name;


 save();

 notify(
  `🏯 انضممت إلى ${guild.name}`
 );

 page('guilds');

}


function leaveGuild(){

 if(
  !currentUser.guild
 ){

  return;

 }


 const guild=
  db.guilds.find(
   g=>
    g.name===
    currentUser.guild
  );


 if(guild){

  guild.members=
   guild.members.filter(
    id=>
     id!==currentUser.id
   );


  if(
   guild.ownerId===
   currentUser.id
  ){

   guild.ownerId=
    guild.members[0]||
    null;

   const newOwner=
    db.users.find(
     u=>
      u.id===
      guild.ownerId
    );

   guild.ownerName=
    newOwner
    ?
    newOwner.username
    :
    'لا يوجد';

  }

 }


 currentUser.guild=
  null;


 save();

 notify(
  '🚪 غادرت النقابة'
 );

 page('guilds');

}

function sendFriendRequest(id){

 const target=
  db.users.find(
   u=>u.id===id
  );


 if(!target){

  alert(
   '❌ اللاعب غير موجود'
  );

  return;

 }


 if(
  target.id===
  currentUser.id
 ){

  alert(
   '❌ لا يمكنك إضافة نفسك'
  );

  return;

 }


 currentUser.friends=
  currentUser.friends||[];


 if(
  currentUser.friends.includes(
   target.id
  )
 ){

  alert(
   '👥 هذا اللاعب صديقك بالفعل'
  );

  return;

 }


 target.friendRequests=
  target.friendRequests||[];


 if(
  target.friendRequests.some(
   r=>r.id===currentUser.id
  )
 ){

  alert(
   '📩 الطلب مرسل مسبقًا'
  );

  return;

 }


 target.friendRequests.push({

  id:
   currentUser.id,

  username:
   currentUser.username,

  time:
   new Date().toLocaleString()

 });


 target.notifications=
  target.notifications||[];


 target.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text:
   `👥 ${currentUser.username} أرسل لك طلب صداقة.`,

  type:'friend',

  read:false,

  time:
   new Date().toLocaleString()

 });


 save();


 notify(
  `📩 تم إرسال طلب الصداقة إلى ${target.username}`
 );

}

function transferMoney(userId){

 const target=
  db.users.find(
   u=>u.id===userId
  );


 if(!target){

  alert(
   '❌ المستلم غير موجود'
  );

  return;

 }


 const amount=
  Number(
   document
    .getElementById(
     'transferAmount'
    )
    .value
  );


 const note=
  document
   .getElementById(
    'transferNote'
   )
   .value
   .trim();


 if(
  !Number.isFinite(amount) ||
  amount<=0
 ){

  alert(
   '❌ أدخل مبلغًا صحيحًا'
  );

  return;

 }


 if(
  amount>
  currentUser.balance
 ){

  alert(
   '❌ رصيدك غير كافٍ'
  );

  return;

 }


 if(
  amount>1000000000
 ){

  alert(
   '❌ المبلغ أكبر من الحد المسموح'
  );

  return;

 }


 currentUser.balance-=
  amount;


 target.balance+=
  amount;


 currentUser.stats=
  currentUser.stats||{};


 target.stats=
  target.stats||{};


 currentUser.stats.transfers=
  (
   currentUser.stats.transfers||
   0
  )+1;


 target.stats.received=
  (
   target.stats.received||
   0
  )+1;


 currentUser.totalSpent=
  (
   currentUser.totalSpent||
   0
  )+
  amount;


 target.totalEarned=
  (
   target.totalEarned||
   0
  )+
  amount;


 addTransaction(
  'تحويل',
  -amount,
  `تحويل إلى ${target.username}${
   note
   ?
   ' - '+note
   :
   ''
  }`
 );


 addTransactionToUser(
  target,
  'استلام',
  amount,
  `استلام من ${currentUser.username}`
 );


 target.notifications=
  target.notifications||[];


 target.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text:
   `💰 استلمت ${money(amount)} 🧧 من ${currentUser.username}`,

  type:'money',

  read:false,

  time:
   new Date().toLocaleString()

 });


 save();


 closeModal();


 notify(
  `✅ تم تحويل ${money(amount)} 🧧 إلى ${target.username}`
 );


 page('wallet');

}

function rollDice(){

 const cost=25;


 if(
  currentUser.balance<
  cost
 ){

  alert(
   '❌ رصيدك غير كافٍ'
  );

  return;

 }


 currentUser.balance-=
  cost;


 currentUser.totalSpent=
  (
   currentUser.totalSpent||0
  )+
  cost;


 const roll=
  Math.floor(
   Math.random()*6
  )+1;


 let reward=0;


 let message='';


 if(roll===6){

  reward=150;

  message=
   '🔥 رقم 6! جائزة كبيرة!';

 }
 else if(roll===5){

  reward=100;

  message=
   '🎉 ممتاز!';

 }
 else if(roll===4){

  reward=75;

  message=
   '✨ جيد جدًا!';

 }
 else if(roll===3){

  reward=50;

  message=
   '👍 حصلت على جائزة.';

 }
 else if(roll===2){

  reward=25;

  message=
   '🙂 استرجعت قيمة اللعب.';

 }
 else{

  reward=0;

  message=
   '💀 حظ أوفر المرة القادمة.';

 }


 currentUser.stats.games=
  (
   currentUser.stats.games||
   0
  )+1;


 if(reward>cost){

  currentUser.stats.wins=
   (
    currentUser.stats.wins||
    0
   )+1;

 }
 else if(reward===0){

  currentUser.stats.losses=
   (
    currentUser.stats.losses||
    0
   )+1;

 }


 if(reward){

  currentUser.balance+=
   reward;

  currentUser.totalEarned=
   (
    currentUser.totalEarned||
    0
   )+
   reward;


  addTransaction(
   'لعبة',
   reward,
   `جائزة النرد رقم ${roll}`
  );

 }


 addTransaction(
  'رسوم لعبة',
  -cost,
  'لعبة النرد'
 );


 addXP(10);


 save();


 const diceFaces=[
  '⚀',
  '⚁',
  '⚂',
  '⚃',
  '⚄',
  '⚅'
 ];


 const result=
  document.getElementById(
   'diceResult'
  );


 const msg=
  document.getElementById(
   'diceMessage'
  );


 if(result){

  result.innerHTML=
   diceFaces[roll-1];

 }


 if(msg){

  msg.innerHTML=
   `
    <b>
     ${message}
    </b>

    <br>

    ${
     reward
     ?
     `💰 +${money(reward)} 🧧`
     :
     '❌ بدون جائزة'
    }
   `;

 }

}

/* =====================================================
   LEVEL SYSTEM
===================================================== */

function addXP(amount){

 amount=
  Number(amount)||0;


 if(amount<=0)return;


 currentUser.xp=
  Number(
   currentUser.xp||0
  )+
  amount;


 let levelUp=false;


 while(
  currentUser.xp>=
  currentUser.level*100
 ){

  currentUser.xp-=
   currentUser.level*100;


  currentUser.level+=1;


  levelUp=true;


  currentUser.power+=25;

  currentUser.attack+=10;

  currentUser.defense+=10;

  currentUser.hp+=50;

 }


 if(levelUp){

  currentUser.notifications=
   currentUser.notifications||[];


  currentUser.notifications.unshift({

   id:
    'notification_'+
    Date.now()+
    Math.random(),

   text:
    `🎉 وصلت إلى المستوى ${currentUser.level}!`,

   type:'level',

   read:false,

   time:
    new Date().toLocaleString()

  });


  notify(
   `🎉 مبروك! وصلت للمستوى ${currentUser.level}`
  );

 }

}

function changeUsername(){

 const input=
  document
   .getElementById(
    'newUsername'
   );


 const name=
  input
   ?
   input.value.trim()
   :
   '';


 if(
  name.length<3
 ){

  alert(
   '❌ الاسم يجب أن يكون 3 أحرف على الأقل'
  );

  return;

 }


 const exists=
  db.users.some(
   u=>
    u.id!==currentUser.id &&
    u.username.toLowerCase()===
    name.toLowerCase()
  );


 if(exists){

  alert(
   '❌ الاسم مستخدم بالفعل'
  );

  return;

 }


 currentUser.username=
  name;


 save();

 closeModal();

 notify(
  '✅ تم تغيير اسم المستخدم'
 );

 page('profile');

}

function adminAddMoney(id){

  !currentUser.isAdmin
 )return;


 const user=
  db.users.find(
   u=>u.id===id
  );


 if(!user)return;


 const amount=
  Number(
   document
    .getElementById(
     'adminAmount'
    )
    .value
  );


 if(
  !Number.isFinite(amount)||
  amount<=0
 ){

  alert(
   '❌ مبلغ غير صحيح'
  );

  return;

 }


 user.balance+=
  amount;


 user.totalEarned=
  (
   user.totalEarned||0
  )+
  amount;


 addTransactionToUser(
  user,
  'إدارة',
  amount,
  `إضافة رصيد بواسطة ${currentUser.username}`
 );


 save();


 closeModal();


 notify(
  `👑 تمت إضافة ${money(amount)} 🧧`
 );


 page('admin');

}

function updateRankForUser(user){

 const level=
  Number(
   user.level||1
  );


 if(level>=100)
  user.rank='👑 ملك';

 else if(level>=50)
  user.rank='إمبراطور';

 else if(level>=30)
  user.rank='أسطوري';

 else if(level>=20)
  user.rank='نخبة';

 else if(level>=10)
  user.rank='محارب';

 else if(level>=5)
  user.rank='مقاتل';

 else
  user.rank='مبتدئ';

}

/* =====================================================
   ACCEPT FRIEND
===================================================== */

function acceptFriend(id){

 const requestIndex=
  (
   currentUser.friendRequests||
   []
  ).findIndex(
   r=>r.id===id
  );


 if(requestIndex===-1){

  alert(
   '❌ الطلب غير موجود'
  );

  return;

 }


 const request=
  currentUser.friendRequests[
   requestIndex
  ];


 const other=
  db.users.find(
   u=>u.id===id
  );


 if(!other){

  currentUser.friendRequests.splice(
   requestIndex,
   1
  );

  save();

  page('friends');

  return;

 }


 currentUser.friends=
  currentUser.friends||[];


 other.friends=
  other.friends||[];


 if(
  !currentUser.friends.includes(
   id
  )
 ){

  currentUser.friends.push(id);

 }


 if(
  !other.friends.includes(
   currentUser.id
  )
 ){

  other.friends.push(
   currentUser.id
  );

 }


 currentUser.friendRequests.splice(
  requestIndex,
  1
 );


 other.notifications=
  other.notifications||[];


 other.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text:
   `👥 ${currentUser.username} قبل طلب صداقتك.`,

  type:'friend',

  read:false,

  time:
   new Date().toLocaleString()

 });


 save();


 notify(
  `✅ أصبحت ${request.username} صديقك`
 );


 page('friends');

}


/* =====================================================
   REJECT FRIEND

function rejectFriend(id){

 currentUser.friendRequests=
  currentUser.friendRequests||[];


 const index=
  currentUser.friendRequests.findIndex(
   r=>r.id===id
  );


 if(index===-1){

  return;

 }


 currentUser.friendRequests.splice(
  index,
  1
 );


 save();


 notify(
  '❌ تم رفض طلب الصداقة'
 );


 page('friends');

}

function removeFriend(id){

 const user=

 if(!user){

function createGuild(){

 const name=
  document
   .getElementById(
    'guildName'
   )
   .value
   .trim();


 const tag=
  document
   .getElementById(
    'guildTag'
   )
   .value
   .trim()
   .toUpperCase();


 const description=
  document
   .getElementById(
    'guildDescription'
   )
   .value
   .trim();


 const cost=1000;


 if(
  name.length<3
 ){

  alert(
   '❌ اسم النقابة قصير جدًا'
  );

  return;

 }


 if(
  tag.length<2
 ){

  alert(
   '❌ اختصار النقابة يجب أن يكون حرفين على الأقل'
  );

  return;

 }


 if(
  currentUser.balance<
  cost
 ){

  alert(
   '❌ تحتاج إلى 1000 🧧 لإنشاء النقابة'
  );

  return;

 }


 db.guilds=
  db.guilds||[];


 const exists=
  db.guilds.some(
   guild=>
    guild.name.toLowerCase()===
    name.toLowerCase()
  );


 if(exists){

  alert(
   '❌ اسم النقابة مستخدم بالفعل'
  );

  return;

 }


 currentUser.balance-=
  cost;


 currentUser.totalSpent=
  (
   currentUser.totalSpent||0
  )+
  cost;


 const guild={

  id:
   'guild_'+
   Date.now()+
   Math.random(),

  name,

  tag,

  description,

  leader:
   currentUser.id,

  leaderName:
   currentUser.username,

  members:[
   currentUser.id
  ],

  level:1,

  xp:0,

  power:
   currentUser.power||0,

  createdAt:
   new Date().toLocaleString()

 };


 db.guilds.push(
  guild
 );


 currentUser.guild=
  guild.name;


 currentUser.guildId=
  guild.id;


 addTransaction(
  'نقابة',
  -cost,
  `إنشاء نقابة ${guild.name}`
 );


 save();


 closeModal();


 notify(
  `🏯 تم إنشاء نقابة ${guild.name}`
 );


 page('guilds');

}


/* =====================================================
   JOIN GUILD
===================================================== */

function joinGuild(id){

 const guild=
  (
   db.guilds||
   []
  ).find(
   g=>g.id===id
  );


 if(!guild){

  alert(
   '❌ النقابة غير موجودة'
  );

  return;

 }


 if(
  currentUser.guildId
 ){

  alert(
   '❌ أنت عضو في نقابة بالفعل'
  );

  return;

 }


 guild.members=
  guild.members||[];


 if(
  guild.members.includes(
   currentUser.id
  )
 ){

  return;

 }


 guild.members.push(
  currentUser.id
 );


 guild.power=
  Number(
   guild.power||0
  )+
  Number(
   currentUser.power||0
  );


 currentUser.guild=
  guild.name;


 currentUser.guildId=
  guild.id;


 save();


 notify(
  `🏯 انضممت إلى ${guild.name}`
 );


 page('guilds');

}


/* =====================================================
   LEAVE GUILD
===================================================== */

function leaveGuild(id){

 const guild=
  (
   db.guilds||
   []
  ).find(
   g=>g.id===id
  );


 if(!guild){

  return;

 }


 if(
  guild.leader===
  currentUser.id
 ){

  alert(
   '❌ قائد النقابة لا يستطيع المغادرة قبل نقل القيادة أو حذف النقابة.'
  );

  return;

 }


 const confirmed=
  confirm(
   `هل تريد مغادرة ${guild.name}؟`
  );


 if(!confirmed){

  return;

 }


 guild.members=
  (
   guild.members||
   []
  ).filter(
   memberId=>
    memberId!==currentUser.id
  );


 guild.power=
  Math.max(
   0,
   Number(
    guild.power||0
   )-
   Number(
    currentUser.power||0
   )
  );


 currentUser.guild=null;

 currentUser.guildId=null;


 save();


 notify(
  '🚪 غادرت النقابة'
 );


 page('guilds');

}

/* =====================================================

===================================================== */

function useItem(itemId){

 currentUser.inventory=
  currentUser.inventory||{};


 if(
  !currentUser.inventory[itemId]||
  currentUser.inventory[itemId]<=0
 ){

  alert(
   '❌ لا تملك هذا العنصر'
  );

  return;

 }


 switch(itemId){

  case 'potion':

   currentUser.power+=50;

   currentUser.inventory.potion--;

   notify(
    '🧪 تم استخدام جرعة القوة +50'
   );

   break;


  case 'shield':

   currentUser.defense+=100;

   currentUser.inventory.shield--;

   notify(
    '🛡️ تم استخدام الدرع +100 دفاع'
   );

   break;


  case 'sword':

   currentUser.attack+=150;

   currentUser.inventory.sword--;

   notify(
    '⚔️ تم استخدام السيف +150 هجوم'
   );

   break;


  case 'hp':

   currentUser.hp+=250;

   currentUser.inventory.hp--;

   notify(
    '❤️ تمت زيادة الصحة +250'
   );

   break;


  case 'box':

   currentUser.inventory.box--;

   const reward=
    500+
    Math.floor(
     Math.random()*1501
    );


   currentUser.balance+=
    reward;


   currentUser.totalEarned=
    (
     currentUser.totalEarned||0
    )+
    reward;


   addTransaction(
    'صندوق',
    reward,
    'جائزة الصندوق النادر'
   );


   notify(
    `📦 فتحت الصندوق وربحت ${money(reward)} 🧧`
   );

   break;


  case 'ticket':

   currentUser.inventory.ticket--;

   notify(
    '🎟️ تم استخدام تذكرة العجلة'
   );

   break;

 }


 addXP(10);


 save();


 page('inventory');

}

function takeLoan(){

 const amount=
  Number(
   document
    .getElementById(
     'loanAmount'
    )
    .value
  );


 if(
  !Number.isFinite(amount)||
  amount<100
 ){

  alert(
   '❌ الحد الأدنى للقرض 100 🧧'
  );

  return;

 }


 if(
  amount>100000
 ){

  alert(
   '❌ الحد الأقصى للقرض 100000 🧧'
  );

  return;

 }


 const interest=10;

 const total=
  Math.ceil(
   amount+
   amount*
   interest/
   100
  );


 currentUser.loan={

  amount,

  interest,

  total,

  paid:0,

  createdAt:
   new Date().toLocaleString()

 };


 currentUser.balance+=
  amount;


 currentUser.totalEarned=
  (
   currentUser.totalEarned||0
  )+
  amount;


 addTransaction(
  'قرض',
  amount,
  `قرض بقيمة ${money(amount)}`
 );


 save();


 closeModal();


 notify(
  `🏦 تم إيداع القرض ${money(amount)} 🧧`
 );


 page('loans');

}


/* =====================================================
   PAY LOAN
===================================================== */

function payLoan(){

 const loan=
  currentUser.loan;


 if(!loan){

  return;

 }


 const remaining=
  Math.max(
   0,
   loan.total-
   (loan.paid||0)
  );


 if(remaining<=0){

  currentUser.loan=null;

  save();

  page('loans');

  return;

 }


 const amount=
  Math.min(
   remaining,
   currentUser.balance
  );


 if(amount<=0){

  alert(
   '❌ لا يوجد رصيد كافٍ للسداد'
  );

  return;

 }


 currentUser.balance-=
  amount;


 currentUser.totalSpent=
  (
   currentUser.totalSpent||0
  )+
  amount;


 loan.paid=
  (
   loan.paid||0
  )+
  amount;


 addTransaction(
  'سداد قرض',
  -amount,
  'سداد القرض'
 );


 if(
  loan.paid>=
  loan.total
 ){

  currentUser.loan=null;

  notify(
   '🎉 تم سداد القرض بالكامل!'
  );

 }
 else{

  notify(
   `💸 تم سداد ${money(amount)} 🧧`
  );

 }


 save();


 page('loans');

}

   STOCK HELPERS
===================================================== */

function stockData(id){

 const stocks={

  sun:{
   name:'S.U.N',
   price:120
  },

  tokyo:{
   name:'TOKYO',
   price:250
  },

  anime:{
   name:'ANIME',
   price:80
  },

  samurai:{
   name:'SAMURAI',
   price:500
  }

 };


 return stocks[id];

}


function buyStock(id){

 const stock=
  stockData(id);


 if(!stock)return;


 if(
  currentUser.balance<
  stock.price
 ){

  alert(
   '❌ رصيدك غير كافٍ'
  );

  return;

 }


 currentUser.balance-=
  stock.price;


 currentUser.totalSpent=
  (
   currentUser.totalSpent||0
  )+
  stock.price;


 currentUser.stocks=
  currentUser.stocks||{};


 currentUser.stocks[id]=
  (
   currentUser.stocks[id]||
   0
  )+1;


 addTransaction(
  'شراء أسهم',
  -stock.price,
  `شراء سهم ${stock.name}`
 );


 save();


 notify(
  `📈 تم شراء سهم ${stock.name}`
 );


 page('stocks');

}


function sellStock(id){

 const stock=
  stockData(id);


 if(!stock)return;


 currentUser.stocks=
  currentUser.stocks||{};


 if(
  !currentUser.stocks[id]||
  currentUser.stocks[id]<=0
 ){

  alert(
   '❌ لا تملك هذا السهم'
  );

  return;

 }


 currentUser.stocks[id]--;


 const sellPrice=
  Math.floor(
   stock.price*
   (
    0.9+
    Math.random()*
    0.3
   )
  );


 currentUser.balance+=
  sellPrice;


 currentUser.totalEarned=
  (
   currentUser.totalEarned||0
  )+
  sellPrice;


 addTransaction(
  'بيع أسهم',
  sellPrice,
  `بيع سهم ${stock.name}`
 );


 save();


 notify(
  `💰 تم بيع السهم مقابل ${money(sellPrice)} 🧧`
 );


 page('stocks');

}


/* =====================================================
   UTILITY
===================================================== */

function esc(value){

 return String(
  value??''
 )
 .replace(
  /&/g,
  '&amp;'
 )
 .replace(
  /</g,
  '&lt;'
 )
 .replace(
  />/g,
  '&gt;'
 )
 .replace(
  /"/g,
  '&quot;'
 )
 .replace(
  /'/g,
  '&#039;'
 );

}


function money(value){

 const number=
  Number(value)||0;


 return number.toLocaleString(
  'en-US',
  {
   maximumFractionDigits:2
  }
 );


}


function notify(message){

 if(
  typeof showToast===
  'function'
 ){

  showToast(
   message
  );

 }
 else{

  console.log(
   message
  );

 }

}

/* =====================================================
   NORMALIZE DATABASE
===================================================== */

function normalizeDatabase(){

 db=
  db||{};


 db.users=
  db.users||[];


 db.chat=
  db.chat||[];


 db.guilds=
  db.guilds||[];


 db.users=
  db.users.map(
   user=>
    normalizeUser(
     user
    )
  );


 if(
  currentUser
 ){

  const freshUser=
   db.users.find(
    user=>
     user.id===
     currentUser.id
   );


  if(freshUser){

   currentUser=
    freshUser;

  }

 }


 db.users.forEach(
  user=>{

   if(
    user.guildId
   ){

    const guild=
     db.guilds.find(
      g=>
       g.id===
       user.guildId
     );


    if(!guild){

     user.guildId=null;

     user.guild=null;

    }

   }

  }
 );

}

function saveAdminUser(id){

 }

  Number(
   document
    .getElementById(
     'editBalance'
    )
    .value
  );


 const power=
  Number(
   document
    .getElementById(
     'editPower'
    )
    .value
  );


 const level=
  Number(
   document
    .getElementById(
     'editLevel'
    )
    .value
  );


 const rank=
  document
   .getElementById(
    'editRank'
   )
   .value
   .trim();


 if(
  !Number.isFinite(balance)||
  !Number.isFinite(power)||
  !Number.isFinite(level)
 ){

  alert(

  return;

 user.balance=
  Math.max(
   0,
   balance

 user.power=

   0,
   power
  );


 user.level=
  Math.max(
   1,
   level
  );


 user.rank=
  rank||
  'مبتدئ';


 save();


 closeModal();


 notify(
  `✅ تم تحديث ${user.username}`
 );


 page('admin');

/* =====================================================

===================================================== */

function sendFriendRequest(id){

 if(
  id===
  currentUser.id
 ){

  alert(
   '❌ لا يمكنك إضافة نفسك'
  );

  return;

 }


 const user=
  db.users.find(
   u=>u.id===id
  );


 if(!user){

  alert(
   '❌ العضو غير موجود'
  );

  return;

 }


 currentUser.friends=
  currentUser.friends||[];


 if(
  currentUser.friends.includes(id)
 ){

  alert(
   '✅ هذا العضو صديقك بالفعل'
  );

  return;

 }


 user.friendRequests=
  user.friendRequests||[];


 if(
  user.friendRequests.some(
   request=>
    request.id===
    currentUser.id
  )
 ){

  alert(
   '📩 تم إرسال الطلب مسبقًا'
  );

  return;

 }


 user.friendRequests.push({

  id:
   currentUser.id,

  username:
   currentUser.username,

  time:
   new Date().toLocaleString()

 });


 user.notifications=
  user.notifications||[];


 user.notifications.unshift({

  id:
   'notification_'+
   Date.now()+
   Math.random(),

  text:
   `👥 ${currentUser.username} أرسل لك طلب صداقة.`,

  type:'friend',

  read:false,

  time:
   new Date().toLocaleString()

 });


 save();

/* =====================================================
   ADD XP
===================================================== */

function addXP(amount){

 amount=
  Number(amount)||0;


 if(amount<=0){

  return;

 }


 currentUser.xp=
  Number(
   currentUser.xp||0
  )+
  amount;


 while(
  currentUser.xp>=
  currentUser.level*
  100
 ){

  const needed=
   currentUser.level*
   100;


  currentUser.xp-=
   needed;


  currentUser.level++;


  currentUser.power=
   Number(
    currentUser.power||0
   )+
   25;


  currentUser.attack=
   Number(
    currentUser.attack||0
   )+
   10;


  currentUser.defense=
   Number(
    currentUser.defense||0
   )+
   10;


  currentUser.hp=
   Number(
    currentUser.hp||0
   )+
   50;


  notify(
   `🎉 ارتقيت إلى المستوى ${currentUser.level}!`
  );

 }


 updateRank();


 save();

}


/* =====================================================
   UPDATE RANK
===================================================== */

function updateRank(){

 const level=
  Number(
   currentUser.level||1
  );


 let rank=
  'مبتدئ';


 if(level>=50)
  rank='👑 إمبراطور';


 else if(level>=40)
  rank='⚔️ أسطورة';


 else if(level>=30)
  rank='🔥 قائد';


 else if(level>=20)
  rank='🛡️ نخبة';


 else if(level>=10)
  rank='⚡ محارب';


 else if(level>=5)
  rank='🎖️ مقاتل';


 currentUser.rank=
  rank;

}
